<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-5">

    <h1>Kontakt</h1>

    <!-- FORM -->
    <form action="https://formspree.io/f/DITT-ID"
          method="POST">

        <div class="mb-3">

            <label class="form-label">
                Namn
            </label>

            <input type="text"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Meddelande
            </label>

            <textarea class="form-control"
                      rows="5"
                      required></textarea>

        </div>

        <button type="submit"
                class="btn btn-primary">

            Skicka

        </button>

    </form>

</div>

</body>
</html>
