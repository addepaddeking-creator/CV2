<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-5">

    <h1>Kontakt</h1>

    <form action="https://formspree.io/f/xaqkwrkq" method="POST">

  <label>Namn</label>
  <input type="text"
         name="name"
         required>

  <label>Email</label>
  <input type="email"
         name="email"
         required>

  <label>Meddelande</label>
  <textarea name="message"
            required></textarea>

  <button type="submit">
      Skicka
  </button>

</form>

</div>

</body>
</html>
