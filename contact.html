<div class="container py-5">

    <h1>Kontakt</h1>

    <form action="https://formspree.io/f/xaqkwrkq" method="POST" class="mt-4">

    <div class="mb-3">
        <label for="name" class="form-label">Namn</label>

        <input type="text"
               id="name"
               name="name"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>

        <input type="email"
               id="email"
               name="email"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label for="message" class="form-label">Meddelande</label>

        <textarea id="message"
                  name="message"
                  class="form-control"
                  rows="5"
                  required></textarea>
    </div>

    <button type="submit" class="btn btn-dark">
        Skicka
    </button>

</form>

</div>
